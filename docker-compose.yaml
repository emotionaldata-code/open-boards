services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: '2567'
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      JWT_SECRET: ${JWT_SECRET:?Set a random secret of at least 32 characters}
      DATABASE_URL: postgres://boards:${POSTGRES_PASSWORD:?Set a URL-safe random database password}@db:5432/boards
    expose:
      - '2567'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2567/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - default
      - dokploy-network
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: boards
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe random database password}
      POSTGRES_DB: boards
    volumes:
      - boards-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boards -d boards']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  boards-data:
networks:
  dokploy-network:
    external: true
