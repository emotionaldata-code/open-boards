services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boards
      POSTGRES_PASSWORD: boards
      POSTGRES_DB: boards
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - boards-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boards -d boards']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  boards-data:
